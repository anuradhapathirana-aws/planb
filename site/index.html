<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Small sizes are the PB monogram alone: the full badge's lettering is
      unreadable at tab size. The touch icon is the full badge on navy, square
      and opaque, because iOS applies its own rounded mask.
    -->
    <!-- `?v=` defeats the browser's favicon cache; bump it whenever the icons change. -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png?v=2" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/favicon-192.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#14224B" />

    <!--
      Per-route title/description/OG tags are set at runtime by react-helmet-async
      and baked into the prerendered HTML at build time (FND-5). What is here is
      the fallback a crawler sees for any route that was not prerendered.
    -->
    <title>Plan B International — Study and work in the UAE</title>
    <meta
      name="description"
      content="Plan B International prepares Sri Lankan students for education and employment in the UAE — online courses, pre-departure checklists and career services."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Plan B International" />
    <meta property="og:title" content="Plan B International — Study and work in the UAE" />
    <meta
      property="og:description"
      content="Online courses, pre-departure checklists and career services for Sri Lankans moving to the UAE."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Sinhala:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
