<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#14224B" />

    <!--
      Per-route title/description/OG tags are set at runtime by react-helmet-async
      and baked into the prerendered HTML at build time (FND-5). What is here is
      the fallback a crawler sees for any route that was not prerendered.
    -->
    <title>Plan B International — Study and work in the UAE</title>
    <meta
      name="description"
      content="Plan B International prepares Sri Lankan students for education and employment in the UAE — online courses, pre-departure checklists and career services."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Plan B International" />
    <meta property="og:title" content="Plan B International — Study and work in the UAE" />
    <meta
      property="og:description"
      content="Online courses, pre-departure checklists and career services for Sri Lankans moving to the UAE."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Sinhala:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
